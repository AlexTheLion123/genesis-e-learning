r/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>A full audit trail of participation and cost.<\u002Fli>\n                <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:4px;width:18px;height:18px;background:var(--band-accent);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>An export-ready assurance pack.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <figure style=\"margin:0;display:grid;gap:12px;min-width:0\">\n        <div role=\"img\" aria-label=\"Exported board capability statement for a fictional bank\" style=\"background:#FFFFFF;color:#1A1A1A;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:clamp(20px,3vw,32px);display:grid;gap:18px\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid #395427;padding-bottom:14px\">\n            <div><div style=\"font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:#395427;font-weight:500\">Board capability statement<\u002Fdiv><div style=\"font-weight:700;font-size:1.0625rem;line-height:1.35\">Highland Cooperative Bank<\u002Fdiv><div style=\"font-size:.75rem;color:#6E6E6E\">Financial year 2025/26 · Assurance pack<\u002Fdiv><\u002Fdiv>\n            <span style=\"flex:none;display:flex;align-items:center;gap:6px;font-size:.6875rem;font-weight:500;padding:5px 10px;border:1px solid #DBD9D6;border-radius:999px\"><span aria-hidden=\"true\" style=\"width:14px;height:14px;background:#395427;-webkit-mask:url(&quot;0c50a8d9-8c87-4332-bd92-e6271a2f23ec&quot;) center/14px no-repeat;mask:url(&quot;0c50a8d9-8c87-4332-bd92-e6271a2f23ec&quot;) center/14px no-repeat\"><\u002Fspan>PDF<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n            <div style=\"background:#F6FAF3;border-radius:8px;padding:12px\"><div style=\"font-size:.6875rem;color:#6E6E6E\">Staff completing core modules<\u002Fdiv><div style=\"font-weight:700;font-size:1.25rem;color:#395427;font-variant-numeric:tabular-nums\">91%<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#F6FAF3;border-radius:8px;padding:12px\"><div style=\"font-size:.6875rem;color:#6E6E6E\">Average score movement<\u002Fdiv><div style=\"font-weight:700;font-size:1.25rem;color:#395427;font-variant-numeric:tabular-nums\">+16 pts<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:.75rem;line-height:1.4\">\n            <sc-raw-thead><sc-raw-tr style=\"text-align:left;color:#6E6E6E\"><sc-raw-th style=\"font-weight:500;padding:6px 0;border-bottom:1px solid #DBD9D6\">Function<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:500;padding:6px 0;border-bottom:1px solid #DBD9D6;text-align:right\">Coverage<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:500;padding:6px 0;border-bottom:1px solid #DBD9D6;text-align:right\">Residual gap<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7\">Compliance and AML<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7;text-align:right;font-variant-numeric:tabular-nums\">96%<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7;text-align:right\">Low<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7\">Branch and retail<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7;text-align:right;font-variant-numeric:tabular-nums\">88%<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7;text-align:right\">Low<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7\">Credit and lending<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7;text-align:right;font-variant-numeric:tabular-nums\">74%<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #EDF4E7;text-align:right\">Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"padding:7px 0\">International trade<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;text-align:right;font-variant-numeric:tabular-nums\">61%<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;text-align:right\">High<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n          <div style=\"font-size:.6875rem;color:#6E6E6E;border-top:1px solid #DBD9D6;padding-top:10px\">Audit trail: 48,210 logged events · Spend tracked across 12 functions<\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font-size:.8125rem;color:var(--on-band-muted)\">Illustrative data. Highland Cooperative Bank is fictional.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1px;background:rgba(228,238,219,.28);border:1px solid rgba(228,238,219,.28);border-radius:16px;overflow:hidden\">\n      <li style=\"background:var(--band);padding:24px;display:grid;gap:4px\"><strong style=\"font-size:1.25rem;color:var(--band-accent)\">Monthly<\u002Fstrong><span style=\"color:var(--on-band-muted)\">an operational dashboard for HR and L&amp;D.<\u002Fspan><\u002Fli>\n      <li style=\"background:var(--band);padding:24px;display:grid;gap:4px\"><strong style=\"font-size:1.25rem;color:var(--band-accent)\">Quarterly<\u002Fstrong><span style=\"color:var(--on-band-muted)\">a capability review with your steering committee.<\u002Fspan><\u002Fli>\n      <li style=\"background:var(--band);padding:24px;display:grid;gap:4px\"><strong style=\"font-size:1.25rem;color:var(--band-accent)\">Annually<\u002Fstrong><span style=\"color:var(--on-band-muted)\">a board capability statement and assurance pack.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between;border-top:1px solid rgba(228,238,219,.28);padding-top:32px\">\n      <p style=\"margin:0;max-width:720px;font-size:1.125rem;line-height:1.65;text-wrap:pretty\">Most training spend cannot be defended when the board asks what it bought. This answers that question as a by-product of running it.<\u002Fp>\n      <a href=\"#book\" sc-camel-on-click=\"{{ go.book }}\" style=\"flex:none;height:48px;padding:0 24px;display:inline-flex;align-items:center;gap:10px;border-radius:8px;background:#7EBE4D;color:#1A1A1A;font-weight:500;text-decoration:none\" style-hover=\"filter:brightness(.92);color:#1A1A1A\" style-active=\"filter:brightness(.88)\">Book a demo<span aria-hidden=\"true\" style=\"width:18px;height:18px;background:#1A1A1A;-webkit-mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat;mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat\"><\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 6 CONTENT AND CERTIFICATION -->\n<section id=\"content\" aria-labelledby=\"content-h\" style=\"background:var(--bg);padding:clamp(64px,8vw,96px) 0\">\n  <div style=\"max-width:1264px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:grid;gap:48px\">\n    <div style=\"display:grid;gap:16px;max-width:720px\">\n      <p style=\"margin:0;font:500 .8125rem/1.2 Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text)\">Content and certification<\u002Fp>\n      <h2 id=\"content-h\" style=\"margin:0;font-weight:700;font-size:clamp(1.75rem,1.2rem + 2vw,2.5rem);line-height:1.2;text-wrap:balance\">A curriculum built in layers, so nobody sits through the wrong course.<\u002Fh2>\n      <p style=\"margin:0;font-size:clamp(1.125rem,1rem + .4vw,1.25rem);line-height:1.6;text-wrap:pretty\">Everyone shares a foundation. Technical depth is added by function, so a treasury dealer and a branch teller do not take the same course.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,64px);align-items:start\">\n      <div role=\"list\" aria-label=\"Curriculum layers\" style=\"display:grid;gap:6px\">\n        <div role=\"listitem\" style=\"background:#EDF4E7;color:#1A1A1A;border-radius:12px;padding:18px 22px\"><strong style=\"display:block;font-size:1.0625rem\">Foundation and onboarding.<\u002Fstrong><span style=\"font-size:.9375rem;line-height:1.5\">Internal processes, the policy library, regulatory essentials, code of conduct.<\u002Fspan><\u002Fdiv>\n        <div role=\"listitem\" style=\"background:#E4EEDB;color:#1A1A1A;border-radius:12px;padding:18px 22px\"><strong style=\"display:block;font-size:1.0625rem\">Digital skills.<\u002Fstrong><span style=\"font-size:.9375rem;line-height:1.5\">Cyber security, data literacy, digital channels and payments.<\u002Fspan><\u002Fdiv>\n        <div role=\"listitem\" style=\"background:#AACC92;color:#1A1A1A;border-radius:12px;padding:18px 22px\"><strong style=\"display:block;font-size:1.0625rem\">Behavioural skills.<\u002Fstrong><span style=\"font-size:.9375rem;line-height:1.5\">Communication, customer experience, supervision.<\u002Fspan><\u002Fdiv>\n        <div role=\"listitem\" style=\"background:#395427;color:#FFFFFF;border-radius:12px;padding:18px 22px;display:grid;gap:12px\">\n          <div><strong style=\"display:block;font-size:1.0625rem\">Technical skills.<\u002Fstrong><span style=\"font-size:.9375rem;line-height:1.5;color:#E4EEDB\">A shared core, then depth by department.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:2fr 3fr;gap:6px;font-size:.8125rem;font-weight:500\">\n            <span style=\"border:1px solid rgba(228,238,219,.5);border-radius:8px;padding:8px 12px\">Shared core<\u002Fspan>\n            <span style=\"background:rgba(126,190,77,.28);border:1px solid rgba(228,238,219,.5);border-radius:8px;padding:8px 12px\">By function<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:32px\">\n        <div style=\"display:grid;gap:8px;padding-bottom:28px;border-bottom:1px solid var(--border)\">\n          <div style=\"font-weight:700;font-size:clamp(2.75rem,2rem + 2.5vw,4rem);line-height:1;color:var(--figure);font-variant-numeric:tabular-nums\">500+<\u002Fdiv>\n          <div style=\"color:var(--text-muted)\">courses<\u002Fdiv>\n          <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"justify-self:start;display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc);background:var(--tbc-bg);border:1px dashed var(--tbc);border-radius:4px;padding:2px 8px\">PLACEHOLDER: confirm the figure and what it counts<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:12px\">\n          <h3 style=\"margin:0;font-weight:700;font-size:1.125rem;line-height:1.4\">Where content comes from<\u002Fh3>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:10px\">\n            <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;03c06449-4829-403d-8fef-e1d7e971c06b&quot;) center/18px no-repeat;mask:url(&quot;03c06449-4829-403d-8fef-e1d7e971c06b&quot;) center/18px no-repeat\"><\u002Fspan>Written in-house by practitioners with banking careers.<\u002Fli>\n            <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;453ef677-be4d-478c-ab24-bf7ad050f3fc&quot;) center/18px no-repeat;mask:url(&quot;453ef677-be4d-478c-ab24-bf7ad050f3fc&quot;) center/18px no-repeat\"><\u002Fspan>Licensed from accredited international providers and localised.<\u002Fli>\n            <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;08d860fb-bb54-4850-a372-4efb7112dce9&quot;) center/18px no-repeat;mask:url(&quot;08d860fb-bb54-4850-a372-4efb7112dce9&quot;) center/18px no-repeat\"><\u002Fspan>Built with you from your own manuals, policies and products.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center\">\n          <a href=\"#book\" sc-camel-on-click=\"{{ askSample }}\" style=\"min-height:44px;display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--link);text-underline-offset:3px\">Ask for a sample module<span aria-hidden=\"true\" style=\"width:18px;height:18px;background:var(--link);-webkit-mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat;mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat\"><\u002Fspan><\u002Fa>\n          <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc);background:var(--tbc-bg);border:1px dashed var(--tbc);border-radius:4px;padding:2px 8px\">PLACEHOLDER: sample module to be produced<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;gap:16px\">\n      <h3 style=\"margin:0;font-weight:700;font-size:1.125rem;line-height:1.4\">Tracks<\u002Fh3>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px;font-size:.875rem;line-height:1.3\">\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Credit and lending<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Corporate finance<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Risk and assurance<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Finance and treasury<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Interest-free banking<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">International banking<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">International trade<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Banking technologies<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Data and analytics<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Strategy and research<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Marketing and communication<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Monitoring and evaluation<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Branch and retail operations<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Support services<\u002Fli>\n        <li style=\"background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px\">Human capital<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid var(--border);border-radius:16px;padding:clamp(24px,3vw,32px);display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n      <span style=\"flex:none;width:48px;height:48px;border-radius:50%;background:var(--icon-bg);display:grid;place-items:center\"><span aria-hidden=\"true\" style=\"width:24px;height:24px;background:var(--icon);-webkit-mask:url(&quot;939baae4-466d-4513-b1d5-2e4a9151c9d0&quot;) center/24px no-repeat;mask:url(&quot;939baae4-466d-4513-b1d5-2e4a9151c9d0&quot;) center/24px no-repeat\"><\u002Fspan><\u002Fspan>\n      <div style=\"flex:1;min-width:240px;display:grid;gap:10px\">\n        <h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Certification<\u002Fh3>\n        <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"justify-self:start;display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc);background:var(--tbc-bg);border:1px dashed var(--tbc);border-radius:4px;padding:4px 8px\">PLACEHOLDER: certification wording. State who issues the certificates, what standard they are assessed against, and what recognition they carry.<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 7 HOW IT STARTS -->\n<section id=\"start\" aria-labelledby=\"start-h\" style=\"background:var(--band);color:var(--on-band);padding:clamp(64px,8vw,96px) 0\">\n  <div style=\"max-width:1264px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:grid;gap:48px\">\n    <div style=\"display:grid;gap:16px;max-width:720px\">\n      <p style=\"margin:0;font:500 .8125rem/1.2 Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--on-band-muted)\">How it starts<\u002Fp>\n      <h2 id=\"start-h\" style=\"margin:0;font-weight:700;font-size:clamp(1.75rem,1.2rem + 2vw,2.5rem);line-height:1.2;text-wrap:balance\">Start small, inside your own bank.<\u002Fh2>\n      <p style=\"margin:0;font-size:clamp(1.125rem,1rem + .4vw,1.25rem);line-height:1.6;color:var(--on-band-muted);text-wrap:pretty\">Before anything goes bank-wide, a showcase runs the full learner journey with 20 to 30 of your own staff, using your content and your branding.<\u002Fp>\n    <\u002Fdiv>\n    <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:32px\">\n      <li style=\"display:grid;gap:14px;align-content:start\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:44px;height:44px;border-radius:50%;background:#7EBE4D;color:#1A1A1A;display:grid;place-items:center;font-weight:700\">1<\u002Fspan><span aria-hidden=\"true\" style=\"flex:1;height:2px;background:rgba(228,238,219,.35)\"><\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Choose the cohort.<\u002Fh3>\n        <p style=\"margin:0;text-wrap:pretty\">Staff drawn across grades, functions and branches, not only volunteers, with two line managers and one executive sponsor observing.<\u002Fp>\n      <\u002Fli>\n      <li style=\"display:grid;gap:14px;align-content:start\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:44px;height:44px;border-radius:50%;background:#7EBE4D;color:#1A1A1A;display:grid;place-items:center;font-weight:700\">2<\u002Fspan><span aria-hidden=\"true\" style=\"flex:1;height:2px;background:rgba(228,238,219,.35)\"><\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Run it live.<\u002Fh3>\n        <p style=\"margin:0;text-wrap:pretty\">Onboarding, one digital and one behavioural module, one technical track, assessments and certification, and the manager dashboard in use.<\u002Fp>\n      <\u002Fli>\n      <li style=\"display:grid;gap:14px;align-content:start\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:44px;height:44px;border-radius:50%;background:#7EBE4D;color:#1A1A1A;display:grid;place-items:center;font-weight:700\">3<\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Review what happened.<\u002Fh3>\n        <p style=\"margin:0;text-wrap:pretty\">Completion, score movement, usability, and how it performs on branch bandwidth. You leave with evidence to show the board.<\u002Fp>\n      <\u002Fli>\n    <\u002Fol>\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:clamp(24px,3vw,32px)\">\n      <p style=\"margin:0;max-width:720px;font-size:1.0625rem;line-height:1.65;text-wrap:pretty\">It lets your people experience the programme before you commit, and shows early what to refine while changes are still quick and inexpensive. <strong>No bank-wide commitment is needed to see it working.<\u002Fstrong><\u002Fp>\n      <a href=\"#book\" sc-camel-on-click=\"{{ go.book }}\" style=\"flex:none;height:48px;padding:0 24px;display:inline-flex;align-items:center;border-radius:8px;border:1.5px solid var(--primary);color:var(--green-text);font-weight:500;text-decoration:none\" style-hover=\"background:var(--bg-tint);color:var(--green-text)\">Book a demo<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 8 WHY GENESIS -->\n<section id=\"why\" aria-labelledby=\"why-h\" style=\"background:var(--bg);padding:clamp(64px,8vw,96px) 0\">\n  <div style=\"max-width:1264px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:grid;gap:48px\">\n    <div style=\"display:grid;gap:16px;max-width:720px\">\n      <p style=\"margin:0;font:500 .8125rem/1.2 Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text)\">Why Genesis<\u002Fp>\n      <h2 id=\"why-h\" style=\"margin:0;font-weight:700;font-size:clamp(1.75rem,1.2rem + 2vw,2.5rem);line-height:1.2;text-wrap:balance\">An African firm that works where the market meets the state.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px\">\n      <div style=\"border-top:2px solid var(--primary);padding-top:20px;display:grid;gap:6px;align-content:start\"><div style=\"font-weight:700;font-size:clamp(1.75rem,1.3rem + 1.5vw,2.5rem);line-height:1.1;color:var(--figure)\">Since 1998<\u002Fdiv><div style=\"color:var(--text-muted)\">working across Africa<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:2px solid var(--primary);padding-top:20px;display:grid;gap:6px;align-content:start\"><div style=\"font-weight:700;font-size:clamp(1.75rem,1.3rem + 1.5vw,2.5rem);line-height:1.1;color:var(--figure)\">50+ countries<\u002Fdiv><div style=\"color:var(--text-muted)\">across Africa<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:2px solid var(--primary);padding-top:20px;display:grid;gap:6px;align-content:start\"><div style=\"font-weight:700;font-size:clamp(1.75rem,1.3rem + 1.5vw,2.5rem);line-height:1.1;color:var(--figure)\">Offices<\u002Fdiv><div style=\"color:var(--text-muted)\">in Johannesburg, Abidjan, Nairobi, Lagos and London<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:2px solid var(--primary);padding-top:20px;display:grid;gap:6px;align-content:start\"><div style=\"font-weight:700;font-size:clamp(1.75rem,1.3rem + 1.5vw,2.5rem);line-height:1.1;color:var(--figure)\">On the ground<\u002Fdiv><div style=\"color:var(--text-muted)\">in Ethiopia<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;max-width:720px;font-size:clamp(1.125rem,1rem + .4vw,1.25rem);line-height:1.6;text-wrap:pretty\">We have run workshops and exposure programmes for banks in Ethiopia and other African markets, and we know the regulatory and operating context.<\u002Fp>\n    <sc-if value=\"{{ showQuote }}\" hint-placeholder-val=\"{{ false }}\">\n      <blockquote style=\"margin:0;max-width:820px;border-left:0;background:var(--bg-tint);border-radius:16px;padding:32px;display:grid;gap:12px\">\n        <span style=\"display:inline-block;justify-self:start;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc);background:var(--tbc-bg);border:1px dashed var(--tbc);border-radius:4px;padding:2px 8px\">RESERVED: pilot bank quote. Hidden until written permission is given.<\u002Fspan>\n      <\u002Fblockquote>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;gap:16px\">\n        <h3 style=\"margin:0;font-weight:700;font-size:1.125rem;line-height:1.4\">The team<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px\">\n          <div style=\"border:1px dashed var(--border-input);border-radius:16px;padding:20px;display:flex;gap:16px;align-items:center\"><span style=\"flex:none;width:56px;height:56px;border-radius:50%;background:repeating-linear-gradient(45deg,var(--icon-bg) 0 6px,var(--bg) 6px 12px);border:1px solid var(--border)\"><\u002Fspan><span style=\"font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc)\">PLACEHOLDER: name, role, one line<\u002Fspan><\u002Fdiv>\n          <div style=\"border:1px dashed var(--border-input);border-radius:16px;padding:20px;display:flex;gap:16px;align-items:center\"><span style=\"flex:none;width:56px;height:56px;border-radius:50%;background:repeating-linear-gradient(45deg,var(--icon-bg) 0 6px,var(--bg) 6px 12px);border:1px solid var(--border)\"><\u002Fspan><span style=\"font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc)\">PLACEHOLDER: name, role, one line<\u002Fspan><\u002Fdiv>\n          <div style=\"border:1px dashed var(--border-input);border-radius:16px;padding:20px;display:flex;gap:16px;align-items:center\"><span style=\"flex:none;width:56px;height:56px;border-radius:50%;background:repeating-linear-gradient(45deg,var(--icon-bg) 0 6px,var(--bg) 6px 12px);border:1px solid var(--border)\"><\u002Fspan><span style=\"font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc)\">PLACEHOLDER: name, role, one line<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 9 WAYS TO WORK WITH US -->\n<section id=\"models\" aria-labelledby=\"models-h\" style=\"background:var(--bg-tint);padding:clamp(64px,8vw,96px) 0\">\n  <div style=\"max-width:1264px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:grid;gap:48px\">\n    <div style=\"display:grid;gap:16px;max-width:720px\">\n      <p style=\"margin:0;font:500 .8125rem/1.2 Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text)\">Ways to work with us<\u002Fp>\n      <h2 id=\"models-h\" style=\"margin:0;font-weight:700;font-size:clamp(1.75rem,1.2rem + 2vw,2.5rem);line-height:1.2;text-wrap:balance\">Three ways to buy the same outcome.<\u002Fh2>\n      <p style=\"margin:0;font-size:clamp(1.125rem,1rem + .4vw,1.25rem);line-height:1.6;text-wrap:pretty\">The capability outcome is the same. What differs is how you pay and who runs the infrastructure. We agree the right shape in the first conversation.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;align-items:stretch\">\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:clamp(24px,3vw,32px);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:500 .8125rem/1 Roboto,sans-serif;letter-spacing:.08em;color:var(--text-muted)\">OPTION A<\u002Fdiv>\n        <h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Managed service<\u002Fh3>\n        <p style=\"margin:0;flex:1;text-wrap:pretty\">We host, run and maintain everything. One annual fee, no capital outlay. Includes the platform, hosting and security, the course catalogue, integration with your HR and identity systems, support and updates.<\u002Fp>\n        <a href=\"#book\" sc-camel-on-click=\"{{ pickA }}\" style=\"min-height:44px;display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--link);text-underline-offset:3px\">Discuss this option<span aria-hidden=\"true\" style=\"width:18px;height:18px;background:var(--link);-webkit-mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat;mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat\"><\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:2px solid var(--primary);border-radius:16px;padding:clamp(23px,3vw,31px);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\"><span style=\"font:500 .8125rem/1 Roboto,sans-serif;letter-spacing:.08em;color:var(--text-muted)\">OPTION B<\u002Fspan><sc-if value=\"{{ showRecommended }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"background:#7EBE4D;color:#1A1A1A;border-radius:999px;padding:4px 12px;font-size:.8125rem;font-weight:500\">Recommended<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Integrated programme<\u002Fh3>\n        <p style=\"margin:0;flex:1;text-wrap:pretty\">Everything in the managed service, plus an agreed volume of expert-led sessions and executive exposure places, under one contract and one annual capability review.<\u002Fp>\n        <a href=\"#book\" sc-camel-on-click=\"{{ pickB }}\" style=\"min-height:44px;display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--link);text-underline-offset:3px\">Discuss this option<span aria-hidden=\"true\" style=\"width:18px;height:18px;background:var(--link);-webkit-mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat;mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat\"><\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:clamp(24px,3vw,32px);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:500 .8125rem/1 Roboto,sans-serif;letter-spacing:.08em;color:var(--text-muted)\">OPTION C<\u002Fdiv>\n        <h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Own and operate<\u002Fh3>\n        <p style=\"margin:0;flex:1;text-wrap:pretty\">You acquire the platform and content library and run them in your own infrastructure, with implementation, integration and an annual support retainer.<\u002Fp>\n        <a href=\"#book\" sc-camel-on-click=\"{{ pickC }}\" style=\"min-height:44px;display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--link);text-underline-offset:3px\">Discuss this option<span aria-hidden=\"true\" style=\"width:18px;height:18px;background:var(--link);-webkit-mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat;mask:url(&quot;56abca66-ea3e-4b5b-b63a-1eb0df48e20e&quot;) center/18px no-repeat\"><\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;color:var(--text-muted)\">Pricing is agreed with each bank.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 10 FAQ (dark band) -->\n<section id=\"faq\" aria-labelledby=\"faq-h\" style=\"background:var(--band);color:var(--on-band);padding:clamp(64px,8vw,96px) 0\">\n  <div style=\"max-width:1264px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:32px 64px;align-items:start\">\n    <div style=\"display:grid;gap:16px;max-width:400px\">\n      <p style=\"margin:0;font:500 .8125rem/1.2 Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--on-band-muted)\">FAQ<\u002Fp>\n      <h2 id=\"faq-h\" style=\"margin:0;font-weight:700;font-size:clamp(1.75rem,1.2rem + 2vw,2.5rem);line-height:1.2\">Questions banks ask us<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"grid-column:span {{ faqSpan }};min-width:0;border-top:1px solid rgba(228,238,219,.28)\">\n      <div style=\"border-bottom:1px solid rgba(228,238,219,.28)\">\n        <h3 style=\"margin:0\"><button type=\"button\" id=\"faq-q0\" aria-expanded=\"{{ faq.0.open }}\" aria-controls=\"faq-a0\" sc-camel-on-click=\"{{ faq.0.toggle }}\" style=\"width:100%;min-height:56px;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:24px;background:none;border:0;color:var(--on-band);font:500 1.0625rem/1.45 Roboto,sans-serif;text-align:left;cursor:pointer\">We already have a learning system, or could run a free one. Why choose this?<span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;background:var(--band-accent);-webkit-mask:url(\" {{=\"\" faq.0.icon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan><\u002Fbutton><\u002Fh3>\n        <sc-if value=\"{{ faq.0.open }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-a0\" role=\"region\" aria-labelledby=\"faq-q0\" style=\"padding:0 44px 20px 0;color:var(--on-band-muted);display:grid;gap:10px\"><p style=\"margin:0\">A learning system is the smaller part. What is hard to get is banking content in Amharic and English that is aligned to National Bank of Ethiopia directives, and the evidence your board and regulator ask for.<\u002Fp><sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"justify-self:start;display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:#C24A12;background:#FFF4EE;border:1px dashed #C24A12;border-radius:4px;padding:2px 8px\">TBC: whether our content and reporting can be delivered into a bank's existing learning system<\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(228,238,219,.28)\">\n        <h3 style=\"margin:0\"><button type=\"button\" id=\"faq-q1\" aria-expanded=\"{{ faq.1.open }}\" aria-controls=\"faq-a1\" sc-camel-on-click=\"{{ faq.1.toggle }}\" style=\"width:100%;min-height:56px;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:24px;background:none;border:0;color:var(--on-band);font:500 1.0625rem/1.45 Roboto,sans-serif;text-align:left;cursor:pointer\">Where is our data stored?<span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;background:var(--band-accent);-webkit-mask:url(\" {{=\"\" faq.1.icon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan><\u002Fbutton><\u002Fh3>\n        <sc-if value=\"{{ faq.1.open }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-a1\" role=\"region\" aria-labelledby=\"faq-q1\" style=\"padding:0 44px 20px 0;color:var(--on-band-muted);display:grid;gap:10px\"><p style=\"margin:0\">We host in Ethiopia and offer in-country data options, designed around Ethiopia's data protection law.<\u002Fp><sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"justify-self:start;display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:#C24A12;background:#FFF4EE;border:1px dashed #C24A12;border-radius:4px;padding:2px 8px\">TBC: legal review of this wording<\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(228,238,219,.28)\">\n        <h3 style=\"margin:0\"><button type=\"button\" id=\"faq-q2\" aria-expanded=\"{{ faq.2.open }}\" aria-controls=\"faq-a2\" sc-camel-on-click=\"{{ faq.2.toggle }}\" style=\"width:100%;min-height:56px;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:24px;background:none;border:0;color:var(--on-band);font:500 1.0625rem/1.45 Roboto,sans-serif;text-align:left;cursor:pointer\">How does it connect to our HR and sign-in systems?<span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;background:var(--band-accent);-webkit-mask:url(\" {{=\"\" faq.2.icon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan><\u002Fbutton><\u002Fh3>\n        <sc-if value=\"{{ faq.2.open }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-a2\" role=\"region\" aria-labelledby=\"faq-q2\" style=\"padding:0 44px 20px 0;color:var(--on-band-muted)\"><p style=\"margin:0\">Staff sign in with the bank's own accounts. Employee data comes in through a standard template, with automated options where your IT team wants them. We do not rebuild the platform for each bank.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(228,238,219,.28)\">\n        <h3 style=\"margin:0\"><button type=\"button\" id=\"faq-q3\" aria-expanded=\"{{ faq.3.open }}\" aria-controls=\"faq-a3\" sc-camel-on-click=\"{{ faq.3.toggle }}\" style=\"width:100%;min-height:56px;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:24px;background:none;border:0;color:var(--on-band);font:500 1.0625rem/1.45 Roboto,sans-serif;text-align:left;cursor:pointer\">Will it work for branches with weak connections?<span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;background:var(--band-accent);-webkit-mask:url(\" {{=\"\" faq.3.icon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan><\u002Fbutton><\u002Fh3>\n        <sc-if value=\"{{ faq.3.open }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-a3\" role=\"region\" aria-labelledby=\"faq-q3\" style=\"padding:0 44px 20px 0;color:var(--on-band-muted)\"><p style=\"margin:0\">The lessons are light and mobile-friendly, so staff far from head office can use them.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(228,238,219,.28)\">\n        <h3 style=\"margin:0\"><button type=\"button\" id=\"faq-q4\" aria-expanded=\"{{ faq.4.open }}\" aria-controls=\"faq-a4\" sc-camel-on-click=\"{{ faq.4.toggle }}\" style=\"width:100%;min-height:56px;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:24px;background:none;border:0;color:var(--on-band);font:500 1.0625rem/1.45 Roboto,sans-serif;text-align:left;cursor:pointer\">What does it cost?<span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;background:var(--band-accent);-webkit-mask:url(\" {{=\"\" faq.4.icon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan><\u002Fbutton><\u002Fh3>\n        <sc-if value=\"{{ faq.4.open }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-a4\" role=\"region\" aria-labelledby=\"faq-q4\" style=\"padding:0 44px 20px 0;color:var(--on-band-muted)\"><p style=\"margin:0\">There are three ways to buy it: a managed service, an integrated programme with in-person sessions and exposure, or own and operate. Pricing is agreed with each bank.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(228,238,219,.28)\">\n        <h3 style=\"margin:0\"><button type=\"button\" id=\"faq-q5\" aria-expanded=\"{{ faq.5.open }}\" aria-controls=\"faq-a5\" sc-camel-on-click=\"{{ faq.5.toggle }}\" style=\"width:100%;min-height:56px;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:24px;background:none;border:0;color:var(--on-band);font:500 1.0625rem/1.45 Roboto,sans-serif;text-align:left;cursor:pointer\">Can we start small?<span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;background:var(--band-accent);-webkit-mask:url(\" {{=\"\" faq.5.icon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan><\u002Fbutton><\u002Fh3>\n        <sc-if value=\"{{ faq.5.open }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-a5\" role=\"region\" aria-labelledby=\"faq-q5\" style=\"padding:0 44px 20px 0;color:var(--on-band-muted)\"><p style=\"margin:0\">Yes. A showcase with 20 to 30 of your staff runs the full learner journey inside your bank before anything goes bank-wide.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(228,238,219,.28)\">\n        <h3 style=\"margin:0\"><button type=\"button\" id=\"faq-q6\" aria-expanded=\"{{ faq.6.open }}\" aria-controls=\"faq-a6\" sc-camel-on-click=\"{{ faq.6.toggle }}\" style=\"width:100%;min-height:56px;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:24px;background:none;border:0;color:var(--on-band);font:500 1.0625rem/1.45 Roboto,sans-serif;text-align:left;cursor:pointer\">What happens after I book a demo?<span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;background:var(--band-accent);-webkit-mask:url(\" {{=\"\" faq.6.icon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan><\u002Fbutton><\u002Fh3>\n        <sc-if value=\"{{ faq.6.open }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"faq-a6\" role=\"region\" aria-labelledby=\"faq-q6\" style=\"padding:0 44px 20px 0;color:var(--on-band-muted)\"><p style=\"margin:0\">A first conversation where we show the platform and talk through your training obligations. If it makes sense, a working session follows with your HR or L&amp;D sponsor and someone from IT for sign-in.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 11 BOOK -->\n<section id=\"book\" aria-labelledby=\"book-h\" style=\"background:var(--bg);padding:clamp(64px,8vw,96px) 0\">\n  <div style=\"max-width:1264px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(32px,5vw,64px);align-items:start\">\n    <div style=\"display:grid;gap:20px;max-width:520px\">\n      <p style=\"margin:0;font:500 .8125rem/1.2 Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text)\">Book a demo or call<\u002Fp>\n      <h2 id=\"book-h\" style=\"margin:0;font-weight:700;font-size:clamp(1.75rem,1.2rem + 2vw,2.5rem);line-height:1.2;text-wrap:balance\">See how it would work for your bank.<\u002Fh2>\n      <p style=\"margin:0;font-size:clamp(1.125rem,1rem + .4vw,1.25rem);line-height:1.6;text-wrap:pretty\">A first conversation with our team. We show the platform, talk through your training obligations, and agree whether a working session makes sense.<\u002Fp>\n      <div style=\"display:flex;gap:14px;background:var(--bg-tint);border-radius:16px;padding:20px 22px;align-items:flex-start\">\n        <span aria-hidden=\"true\" style=\"flex:none;margin-top:2px;width:22px;height:22px;background:var(--icon);-webkit-mask:url(&quot;5940b84c-d4f3-493b-9fbc-ebf0c50e7aa3&quot;) center/22px no-repeat;mask:url(&quot;5940b84c-d4f3-493b-9fbc-ebf0c50e7aa3&quot;) center/22px no-repeat\"><\u002Fspan>\n        <p style=\"margin:0;line-height:1.6;text-wrap:pretty\">Training budgets are set annually. Speaking to us before your budget round closes lets you fund this from the coming year's allocation.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center\">or write to us at <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc);background:var(--tbc-bg);border:1px dashed var(--tbc);border-radius:4px;padding:2px 8px\">PLACEHOLDER: contact email<\u002Fspan><\u002Fsc-if><\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:clamp(24px,3vw,32px);box-shadow:0 1px 2px rgba(26,26,26,.06)\">\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"status\" style=\"display:grid;gap:16px;justify-items:start;padding:24px 0\">\n          <span style=\"width:56px;height:56px;border-radius:50%;background:var(--icon-bg);display:grid;place-items:center\"><span aria-hidden=\"true\" style=\"width:28px;height:28px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/28px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/28px no-repeat\"><\u002Fspan><\u002Fspan>\n          <p style=\"margin:0;font-size:1.25rem;font-weight:700;line-height:1.4\">Thank you.<\u002Fp>\n          <p style=\"margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center\">We will be in touch within <span style=\"display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc);background:var(--tbc-bg);border:1px dashed var(--tbc);border-radius:4px;padding:2px 8px\">TBC: response time<\u002Fspan> to arrange a time.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ submit }}\" sc-camel-no-validate=\"{{ true }}\" aria-label=\"Request a demo\" style=\"display:grid;gap:20px\">\n          <sc-if value=\"{{ hasErrors }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"alert\" sc-camel-tab-index=\"-1\" ref=\"{{ summaryRef }}\" style=\"border:1.5px solid var(--err);border-radius:8px;padding:12px 16px;color:var(--err);font-size:.9375rem;line-height:1.5\">Please check the highlighted fields: {{ errorSummary }}.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px\">\n            <div style=\"display:grid;gap:6px\"><label for=\"f-name\" style=\"font-weight:500;font-size:.9375rem\">Full name<\u002Flabel><input id=\"f-name\" name=\"name\" sc-camel-auto-complete=\"name\" aria-invalid=\"{{ err.name.bad }}\" aria-describedby=\"e-name\" style=\"height:48px;padding:0 14px;border-radius:8px;border:1px solid {{ err.name.border }};background:var(--surface);color:var(--text);font:400 1rem Roboto,sans-serif;width:100%\"><sc-if value=\"{{ err.name.bad }}\" hint-placeholder-val=\"{{ false }}\"><span id=\"e-name\" style=\"color:var(--err);font-size:.875rem\">Enter your full name.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div style=\"display:grid;gap:6px\"><label for=\"f-bank\" style=\"font-weight:500;font-size:.9375rem\">Bank<\u002Flabel><input id=\"f-bank\" name=\"bank\" sc-camel-auto-complete=\"organization\" aria-invalid=\"{{ err.bank.bad }}\" aria-describedby=\"e-bank\" style=\"height:48px;padding:0 14px;border-radius:8px;border:1px solid {{ err.bank.border }};background:var(--surface);color:var(--text);font:400 1rem Roboto,sans-serif;width:100%\"><sc-if value=\"{{ err.bank.bad }}\" hint-placeholder-val=\"{{ false }}\"><span id=\"e-bank\" style=\"color:var(--err);font-size:.875rem\">Enter the name of your bank.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div style=\"display:grid;gap:6px\"><label for=\"f-role\" style=\"font-weight:500;font-size:.9375rem\">Role<\u002Flabel><input id=\"f-role\" name=\"role\" sc-camel-auto-complete=\"organization-title\" aria-invalid=\"{{ err.role.bad }}\" aria-describedby=\"e-role\" style=\"height:48px;padding:0 14px;border-radius:8px;border:1px solid {{ err.role.border }};background:var(--surface);color:var(--text);font:400 1rem Roboto,sans-serif;width:100%\"><sc-if value=\"{{ err.role.bad }}\" hint-placeholder-val=\"{{ false }}\"><span id=\"e-role\" style=\"color:var(--err);font-size:.875rem\">Enter your role.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div style=\"display:grid;gap:6px\"><label for=\"f-email\" style=\"font-weight:500;font-size:.9375rem\">Work email<\u002Flabel><input id=\"f-email\" name=\"email\" type=\"email\" sc-camel-auto-complete=\"email\" sc-camel-input-mode=\"email\" aria-invalid=\"{{ err.email.bad }}\" aria-describedby=\"e-email\" style=\"height:48px;padding:0 14px;border-radius:8px;border:1px solid {{ err.email.border }};background:var(--surface);color:var(--text);font:400 1rem Roboto,sans-serif;width:100%\"><sc-if value=\"{{ err.email.bad }}\" hint-placeholder-val=\"{{ false }}\"><span id=\"e-email\" style=\"color:var(--err);font-size:.875rem\">Enter a work email, like name@bank.com.et<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:6px\"><label for=\"f-phone\" style=\"font-weight:500;font-size:.9375rem\">Phone <span style=\"font-weight:400;color:var(--text-muted)\">(optional)<\u002Fspan><\u002Flabel><input id=\"f-phone\" name=\"phone\" type=\"tel\" sc-camel-auto-complete=\"tel\" style=\"height:48px;padding:0 14px;border-radius:8px;border:1px solid var(--border-input);background:var(--surface);color:var(--text);font:400 1rem Roboto,sans-serif;width:100%\"><\u002Fdiv>\n          <div style=\"display:grid;gap:6px\"><label for=\"f-msg\" style=\"font-weight:500;font-size:.9375rem\">Anything you'd like us to know <span style=\"font-weight:400;color:var(--text-muted)\">(optional)<\u002Fspan><\u002Flabel><textarea id=\"f-msg\" name=\"message\" rows=\"4\" ref=\"{{ msgRef }}\" style=\"padding:12px 14px;border-radius:8px;border:1px solid var(--border-input);background:var(--surface);color:var(--text);font:400 1rem/1.5 Roboto,sans-serif;width:100%;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n          <button type=\"submit\" style=\"height:48px;padding:0 24px;border:0;border-radius:8px;background:var(--primary);color:var(--on-primary);font:500 1rem Roboto,sans-serif;cursor:pointer\" style-hover=\"filter:brightness(.92)\" style-active=\"filter:brightness(.88)\">Request a demo<\u002Fbutton>\n          <p style=\"margin:0;font-size:.875rem;line-height:1.55;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center\">We will use these details only to arrange your demo. <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc);background:var(--tbc-bg);border:1px dashed var(--tbc);border-radius:4px;padding:2px 8px\">PLACEHOLDER: link to privacy policy<\u002Fspan><\u002Fsc-if><\u002Fp>\n        <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:#395427;color:#FFFFFF;padding:56px 0 40px\">\n  <div style=\"max-width:1264px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:grid;gap:32px\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:flex-start\">\n      <div style=\"display:grid;gap:6px\">\n        <span style=\"font:700 1.375rem/1 Roboto,sans-serif;letter-spacing:.14em\">GENESIS<\u002Fspan>\n        <span style=\"color:#E4EEDB;font-size:.9375rem\">Unlocking value<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:8px;color:#E4EEDB;font-size:.9375rem\">\n        <span style=\"font-weight:500;color:#FFFFFF\">Contact<\u002Fspan>\n        <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:#C24A12;background:#FFF4EE;border:1px dashed #C24A12;border-radius:4px;padding:2px 8px\">PLACEHOLDER: email and phone<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid rgba(228,238,219,.28);padding-top:24px;font-size:.875rem;color:#E4EEDB\">\n      <span>© 2026 Genesis Analytics<\u002Fspan>\n      <a href=\"#\" style=\"color:#E4EEDB;min-height:24px\">Privacy policy<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;headline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Prove what your training investment delivered.&quot;,&quot;Training your regulator and your board can see.&quot;,&quot;Every employee trained. Every record provable.&quot;],&quot;default&quot;:&quot;Prove what your training investment delivered.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;system&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showMarkers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review&quot;},&quot;showRecommended&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review&quot;},&quot;showQuoteSlot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review&quot;}}\">\nconst ICON_DATA = {\"sun\":\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%224%22%2F%3E%3Cpath%20d%3D%22M12%202v2M12%2020v2M4.93%204.93l1.41%201.41M17.66%2017.66l1.41%201.41M2%2012h2M20%2012h2M6.34%2017.66l-1.41%201.41M19.07%204.93l-1.41%201.41%22%2F%3E%3C%2Fsvg%3E\",\"moon\":\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stro rs: {}, sent: false, override: null };\n  msgRef = React.createRef();\n  summaryRef = React.createRef();\n  componentDidMount() {\n    this.onR = () => this.setState({ w: window.innerWidth });\n    this.onS = () => { const s = window.scrollY > 8; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };\n    window.addEventListener('resize', this.onR);\n    window.addEventListener('scroll', this.onS, { passive: true });\n    this.mq = window.matchMedia('(prefers-color-scheme: dark)');\n    this.onMq = () => this.forceUpdate();\n    this.mq.addEventListener && this.mq.addEventListener('change', this.onMq);\n    this.applyTheme();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onR);\n    window.removeEventListener('scroll', this.onS);\n    this.mq && this.mq.removeEventListener && this.mq.removeEventListener('change', this.onMq);\n  }\n  componentDidUpdate(pp, ps) {\n    this.applyTheme();\n    if (pp.theme !== this.props.theme && this.state.override) this.setState({ override: null });\n  }\n  theme() { return this.state.override || this.props.theme || 'light'; }\n  isDark() { const t = this.theme(); return t === 'dark' || (t === 'system' && this.mq && this.mq.matches); }\n  applyTheme() {\n    const t = this.theme(), r = document.documentElement;\n    if (t === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);\n  }\n  scrollTo(id) {\n    const el = document.getElementById(id); if (!el) return;\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: reduce ? 'auto' : 'smooth' });\n  }\n  nav = id => e => { e && e.preventDefault(); this.setState({ menu: false }); this.scrollTo(id); };\n  prefill = key => e => {\n    e.preventDefault();\n    const go = () => { const t = this.msgRef.current; if (t) { t.value = MSG[key]; setTimeout(() => t.focus({ preventScroll: true }), 450); } this.

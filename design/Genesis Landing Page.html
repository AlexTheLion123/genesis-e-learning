    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

        }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ecoration:none;font-size:.9375rem;font-weight:500\" style-hover=\"background:var(--bg-tint);color:var(--text)\">FAQ<\u002Fa>\n      <\u002Fnav>\n    <\u002Fsc-if>\n    <div style=\"display:flex;align-items:center;gap:8px;margin-left:auto;flex:none\">\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"{{ themeLabel }}\" title=\"{{ themeLabel }}\" style=\"width:44px;height:44px;border:0;background:transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center\" style-hover=\"background:var(--bg-tint)\">\n        <span aria-hidden=\"true\" style=\"width:20px;height:20px;background:var(--text);-webkit-mask:url(\" {{=\"\" themeicon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan>\n      <\u002Fbutton>\n      <a href=\"#book\" sc-camel-on-click=\"{{ go.book }}\" style=\"height:44px;padding:0 20px;display:inline-flex;align-items:center;border-radius:8px;background:var(--primary);color:var(--on-primary);font-weight:500;font-size:.9375rem;text-decoration:none;white-space:nowrap\" style-hover=\"filter:brightness(.92);color:var(--on-primary)\" style-active=\"filter:brightness(.88)\">Book a demo<\u002Fa>\n      <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-expanded=\"{{ menuOpen }}\" aria-controls=\"mobile-menu\" aria-label=\"Menu\" style=\"width:44px;height:44px;border:1px solid var(--border);background:transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center\">\n          <span aria-hidden=\"true\" style=\"width:20px;height:20px;background:var(--text);-webkit-mask:url(\" {{=\"\" menuicon=\"\" }}\")=\"\" center=\"\" 20px=\"\" no-repeat;mask:url(\"{{=\"\" no-repeat\"=\"\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ showMenu }}\" hint-placeholder-val=\"{{ false }}\">\n    <nav id=\"mobile-menu\" aria-la  clamp(16px,4vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(40px,5vw,64px);align-items:center\">\n    <div style=\"display:grid;gap:24px;max-width:600px\">\n      <p style=\"margin:0;font:500 .8125rem/1.2 Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text)\">Training capability for Ethiopian banks<\u002Fp>\n      <h1 id=\"hero-h\" style=\"margin:0;font-weight:700;font-size:clamp(2.25rem,1.4rem + 3.2vw,3.5rem);line-height:1.14;letter-spacing:-.015em;text-wrap:balance\">\n        <sc-if value=\"{{ h0 }}\" hint-placeholder-val=\"{{ true }}\">Prove what your training investment delivered.<\u002Fsc-if>\n        <sc-if value=\"{{ h1 }}\" hint-placeholder-val=\"{{ false }}\">Training your regulator and your board can see.<\u002Fsc-if>\n        <sc-if value=\"{{ h2 }}\" hint-placeholder-val=\"{{ false }}\">Every employee trained. Every record provable.<\u002Fsc-if>\n      <\u002Fh1>\n      <p style=\"margin:0;font-size:clamp(1.125rem,1rem + .4vw,1.25rem);line-height:1.6;color:var(--text);max-width:560px;text-wrap:pretty\">Genesis helps Ethiopian banks reach every employee, close the skills gaps that matter, and produce the evidence the National Bank of Ethiopia and your board ask for.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:8px\">\n        <a href=\"#book\" sc-camel-on-click=\"{{ go.book }}\" style=\"height:48px;padding:0 24px;display:inline-flex;align-items:center;border-radius:8px;background:var(--primary);color:var(--on-primary);font-weight:500;text-decoration:none\" style-hover=\"filter:brightness(.92);color:var(--on-primary)\" style-active=\"filter:brightness(.88)\">Book a demo<\u002Fa>\n        <a href=\"#offer\" sc-camel-on-click=\"{{ go.offer }}\" style=\"height:48px;padding:0 24px;display:inline-flex;align-items:center;border-radius:8px;border:1.5px solid var(--primary);color:var(--green-text);font-weight:500;text-decoration:none\" style-hove t:1.6;color:var(--on-band-muted);text-wrap:pretty\">Ethiopian banks are required to invest a fixed share in developing their people. Few can show who was trained, in what, and whether anything changed at work.<\u002Fp>\n        <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"justify-self:start;display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:var(--tbc);background:var(--tbc-bg);border:1px dashed var(--tbc);border-radius:4px;padding:2px 8px\">TBC: confirm the figure, what it is a percentage of, and the directive that sets it before publishing<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ gapCols }}\">\n      <div style=\"padding:{{ quad.a.pad }};border-right:{{ quad.a.br }};border-bottom:{{ quad.a.bb }};display:grid;gap:12px;align-content:start;min-width:0\">\n        <div style=\"font-weight:700;font-size:clamp(3.5rem,2.5rem + 4vw,6rem);line-height:.95;color:#7EBE4D;font-variant-numeric:tabular-nums;letter-spacing:-.02em\">2%<\u002Fdiv>\n        <div style=\"color:var(--on-band-muted);line-height:1.5;max-width:320px\">the share banks are required to invest in staff development<\u002Fdiv>\n        <sc-if value=\"{{ markers }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"justify-self:start;display:inline-block;font:500 .75rem/1.5 ui-monospace,Menlo,monospace;color:#C24A12;background:#FFF4EE;border:1px dashed #C24A12;border-radius:4px;padding:2px 8px\">TBC: as above<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"padding:{{ quad.b.pad }};border-right:{{ quad.b.br }};border-bottom:{{ quad.b.bb }};display:grid;gap:12px;align-content:start;min-width:0\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:28px;height:28px;background:var(--band-accent);-webkit-mask:url(&quot;30bdbab7-5aaa-498d-b22b-422dd0af51e6&quot;) center/28px no-repeat;mask:url(&quot;30bdbab7-5aaa-498d-b22b-422dd0af51e6&quot;) center/28px no-repeat\"><\u002Fspan>\n        <h3 style=\"margin:8px 0 0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33;color:var(--on-band)\">It reaches a fraction of staff.<\u002Fh3>\n        <p style=\"margin:0;max-width:440px;color:var(--on-band-muted);text-wrap:pretty\">Sessions go to whoever can be released. Most new hires across the branch network never get a place.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:{{ quad.c.pad }};border-right:{{ quad.c.br }};border-bottom:{{ quad.c.bb }};display:grid;gap:12px;align-content:start;min-width:0\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:28px;height:28px;background:var(--band-accent);-webkit-mask:url(&quot;8e395474-7f4e-418e-82b2-954d78fdc9de&quot;) center/28px no-repeat;mask:url(&quot;8e395474-7f4e-418e-82b2-954d78fdc9de&quot;) center/28px no-repeat\"><\u002Fspan>\n        <h3 style=\"margin:8px 0 0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33;color:var(--on-band)\">It cannot be measured.<\u002Fh3>\n        <p style=\"margin:0;max-width:440px;color:var(--on-band-muted);text-wrap:pretty\">Attendance is recorded. Comprehension is not, so there is no baseline and no way to show that capability moved.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:{{ quad.d.pad }};border-right:{{ quad.d.br }};border-bottom:{{ quad.d.bb }};display:grid;gap:12px;align-content:start;min-width:0\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:28px;height:28px;background:var(--band-accent);-webkit-mask:url(&quot;db22ecb4-7c04-4805-95cf-c3faab866b66&quot;) center/28px no-repeat;mask:url(&quot;db22ecb4-7c04-4805-95cf-c3faab866b66&quot;) center/28px no-repeat\"><\u002Fspan>\n        <h3 style=\"margin:8px 0 0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33;color:var(--on-band)\">It leaves nothing behind.<\u002Fh3>\n        <p style=\"margin:0;max-width:440px;color:var(--on-band-muted);text-wrap:pretty\">When the session ends, the content ends with it. There is no library and no refresher.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;max-width:720px;font-size:1.125rem;line-height:1.65;color:var(--on-band);text-wrap:pretty\">Anti-money laundering, IFRS and tighter supervision mean compliance knowledge has to be current, universal and provable. <strong style=\"font-weight:700\">Training is not the problem. Relying on scheduled sessions alone is.<\u002Fstrong><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3 WHAT YOU GET -->\n<section id=\"offer\" aria-labelledby=\"offer-h\" style=\"background:var(--bg);padding:clamp(64px,8vw,96px) 0\">\n  <div style=\"max-width:1264px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:grid;gap:48px\">\n    <div style=\"display:grid;gap:16px;max-width:720px\">\n      <p style=\"margin:0;font:500 .8125rem/1.2 Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text)\">What you get<\u002Fp>\n      <h2 id=\"offer-h\" style=\"margin:0;font-weight:700;font-size:clamp(1.75rem,1.2rem + 2vw,2.5rem);line-height:1.2;text-wrap:balance\">One programme. Three ways to build capability.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));border-top:2px solid var(--primary);border-bottom:1px solid var(--border)\">\n      <p style=\"margin:0;padding:24px 24px 24px 0;font-size:1.125rem;line-height:1.5\"><strong style=\"display:block;font-size:1.5rem;line-height:1.3;color:var(--green-text)\">Reach<\u002Fstrong>every employee, every grade, every branch.<\u002Fp>\n      <p style=\"margin:0;padding:24px 24px 24px 0;font-size:1.125rem;line-height:1.5\"><strong style=\"display:block;font-size:1.5rem;line-height:1.3;color:var(--green-text)\">Target<\u002Fstrong>the functions where the gap is deepest.<\u002Fp>\n      <p style=\"margin:0;padding:24px 24px 24px 0;font-size:1.125rem;line-height:1.5\"><strong style=\"display:block;font-size:1.5rem;line-height:1.3;color:var(--green-text)\">Prove<\u002Fstrong>what the investment delivered.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px\">\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:clamp(24px,3vw,32px);display:grid;gap:16px;align-content:start\">\n        <span style=\"width:48px;height:48px;border-radius:50%;background:var(--icon-bg);display:grid;place-items:center\"><span aria-hidden=\"true\" style=\"width:24px;height:24px;background:var(--icon);-webkit-mask:url(&quot;99a6b53f-6e77-4e55-af37-cedef6e9887e&quot;) center/24px no-repeat;mask:url(&quot;99a6b53f-6e77-4e55-af37-cedef6e9887e&quot;) center/24px no-repeat\"><\u002Fspan><\u002Fspan>\n        <div><h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Digital learning platform<\u002Fh3><p style=\"margin:4px 0 0;font-size:.875rem;color:var(--text-muted);line-height:1.5\">Always on, whole workforce<\u002Fp><\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:16px 0 0;border-top:1px solid var(--border);display:grid;gap:10px\">\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Bilingual banking curriculum in Amharic and English<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Assessments, certificates and learning paths by grade<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Your own manuals and policies turned into modules<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Completion and competency dashboards for HR and management<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:clamp(24px,3vw,32px);display:grid;gap:16px;align-content:start\">\n        <span style=\"width:48px;height:48px;border-radius:50%;background:var(--icon-bg);display:grid;place-items:center\"><span aria-hidden=\"true\" style=\"width:24px;height:24px;background:var(--icon);-webkit-mask:url(&quot;bc2380c9-0d74-4a37-b806-46bd92e25077&quot;) center/24px no-repeat;mask:url(&quot;bc2380c9-0d74-4a37-b806-46bd92e25077&quot;) center/24px no-repeat\"><\u002Fspan><\u002Fspan>\n        <div><h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Expert-led in-person training<\u002Fh3><p style=\"margin:4px 0 0;font-size:.875rem;color:var(--text-muted);line-height:1.5\">Focused cohorts<\u002Fp><\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:16px 0 0;border-top:1px solid var(--border);display:grid;gap:10px\">\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Sessions for a nominated cohort each cycle<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Content agreed against your own priority gaps<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Experts brought in from other markets, applied to your products<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Certification that carries weight internally<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:clamp(24px,3vw,32px);display:grid;gap:16px;align-content:start\">\n        <span style=\"width:48px;height:48px;border-radius:50%;background:var(--icon-bg);display:grid;place-items:center\"><span aria-hidden=\"true\" style=\"width:24px;height:24px;background:var(--icon);-webkit-mask:url(&quot;d4d12b34-a97f-47cb-a75b-c1a5774abf71&quot;) center/24px no-repeat;mask:url(&quot;d4d12b34-a97f-47cb-a75b-c1a5774abf71&quot;) center/24px no-repeat\"><\u002Fspan><\u002Fspan>\n        <div><h3 style=\"margin:0;font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.33\">Executive exposure programme<\u002Fh3><p style=\"margin:4px 0 0;font-size:.875rem;color:var(--text-muted);line-height:1.5\">Board and senior leadership<\u002Fp><\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:16px 0 0;border-top:1px solid var(--border);display:grid;gap:10px\">\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Study visits to reference banks abroad<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Regulator, fintech and market infrastructure briefings<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>Peer sessions with executives who have led the same change<\u002Fli>\n          <li style=\"display:flex;gap:12px;line-height:1.5\"><span aria-hidden=\"true\" style=\"flex:none;margin-top:3px;width:18px;height:18px;background:var(--icon);-webkit-mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat;mask:url(&quot;1ed749b7-d9fd-4afd-a41d-10b7bc081830&quot;) center/18px no-repeat\"><\u002Fspan>A board briefing pack on return<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figure style=\"margin:0 auto;display:grid;gap:16px;min-width:0;width:100%;max-width:760px\">\n      <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr))\">\n        <div style=\"grid-column:1 / 13\">\n          <div role=\"img\" aria-label=\"Capability dashboard for a fictional bank, showing staff reached, completion rate and score movement\" style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface-raised);box-shadow:0 8px 24px rgba(26,26,26,.12);overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-tint)\">\n              <div style=\"display:flex;gap:5px\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--border)\"><\u002Fspan><span style=\"width:8px;height:8px;border-radius:50%;background:var(--border)\"><\u002Fspan><span style=\"width:8px;height:8px;border-radius:50%;background:var(--border)\"><\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1;min-width:0;font:400 .6875rem/1 ui-monospace,Menlo,monospace;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">learn.acaciabank.example/capability<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:16px;display:grid;gap:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap\">\n                <div><div style=\"font-size:.6875rem;color:var(--text-muted);line-height:1.3\">Acacia Bank · HR and L&amp;D<\u002Fdiv><div style=\"font-weight:700;font-size:1rem;line-height:1.3\">Capability dashboard<\u002Fdiv><\u002Fdiv>\n                <span style=\"font-size:.6875rem;font-weight:500;padding:
